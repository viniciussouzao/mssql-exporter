version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: mssql-exporter
    main: ./
    binary: mssql-exporter
    env:
      - CGO_ENABLED=0
    # Same as the Makefile and the Dockerfile: no build machine paths in the
    # binaries.
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/viniciussouzao/mssql-exporter/internal/version.Version={{ .Version }}
      - -X github.com/viniciussouzao/mssql-exporter/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/viniciussouzao/mssql-exporter/internal/version.Date={{ .Date }}

archives:
  - id: mssql-exporter
    ids: [mssql-exporter]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    # Listing files replaces GoReleaser's default (README/LICENSE/CHANGELOG).
    files:
      - README.md
      - LICENSE
      # The README links to these; the validation backlog stays out (it is
      # long, in Portuguese, and only useful in the repository).
      - docs/*.md
      - config.example.yml
      - contrib/systemd/mssql-exporter.service
      - contrib/prometheus/alerts.yml

# Multi-arch image on ghcr.io from the linux binaries above (Dockerfile.release
# only copies them). The OCI labels link the package to this repository.
dockers_v2:
  - id: mssql-exporter
    ids: [mssql-exporter]
    dockerfile: Dockerfile.release
    images:
      - "ghcr.io/viniciussouzao/mssql-exporter"
    tags:
      - "v{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.title": "mssql-exporter"
      "org.opencontainers.image.description": "Prometheus exporter for Microsoft SQL Server"
      "org.opencontainers.image.source": "https://github.com/viniciussouzao/mssql-exporter"
      "org.opencontainers.image.url": "https://github.com/viniciussouzao/mssql-exporter"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.licenses": "Apache-2.0"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "Merge pull request"

release:
  github:
    owner: viniciussouzao
    name: mssql-exporter
