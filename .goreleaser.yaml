version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: mssql-exporter
    main: ./
    binary: mssql-exporter
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/viniciussouzao/mssql-exporter/internal/version.Version={{ .Version }}
      - -X github.com/viniciussouzao/mssql-exporter/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/viniciussouzao/mssql-exporter/internal/version.Date={{ .Date }}

archives:
  - id: mssql-exporter
    ids: [mssql-exporter]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    # Listing files replaces GoReleaser's default (README/LICENSE/CHANGELOG).
    files:
      - README.md
      - LICENSE
      - config.example.yml
      - contrib/systemd/mssql-exporter.service
      - contrib/prometheus/alerts.yml

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "Merge pull request"

release:
  github:
    owner: viniciussouzao
    name: mssql-exporter
