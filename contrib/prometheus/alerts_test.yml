# Unit tests for alerts.yml: `promtool test rules alerts_test.yml`.
# They cover the rules whose joins or time logic are easy to get wrong.

rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'sqlserver_up{instance="db1:10060",sqlserver_instance="DB1"}'
        values: '1 1 0x10'
    alert_rule_test:
      - eval_time: 2m
        alertname: SQLServerDown
        exp_alerts: []
      - eval_time: 6m
        alertname: SQLServerDown
        exp_alerts:
          - exp_labels: {severity: critical, instance: "db1:10060", sqlserver_instance: DB1}
            exp_annotations:
              summary: "SQL Server DB1 is unreachable from the exporter"

  # Only truncation blockers other than the normal LOG_BACKUP/CHECKPOINT, and
  # only with the log filling up.
  - interval: 1m
    input_series:
      - series: 'sqlserver_database_log_reuse_wait{instance="db1:10060",sqlserver_instance="DB1",db_name="app",reason="ACTIVE_TRANSACTION"}'
        values: '1x40'
      - series: 'sqlserver_database_log_used_percent{instance="db1:10060",sqlserver_instance="DB1",db_name="app"}'
        values: '70x40'
      - series: 'sqlserver_database_log_reuse_wait{instance="db1:10060",sqlserver_instance="DB1",db_name="busy",reason="LOG_BACKUP"}'
        values: '1x40'
      - series: 'sqlserver_database_log_used_percent{instance="db1:10060",sqlserver_instance="DB1",db_name="busy"}'
        values: '90x40'
      - series: 'sqlserver_database_log_reuse_wait{instance="db1:10060",sqlserver_instance="DB1",db_name="small",reason="ACTIVE_TRANSACTION"}'
        values: '1x40'
      - series: 'sqlserver_database_log_used_percent{instance="db1:10060",sqlserver_instance="DB1",db_name="small"}'
        values: '20x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: SQLServerLogNotTruncating
        exp_alerts:
          - exp_labels: {severity: warning, instance: "db1:10060", sqlserver_instance: DB1, db_name: app, reason: ACTIVE_TRANSACTION}
            exp_annotations:
              summary: "Log of app on DB1 cannot be truncated (ACTIVE_TRANSACTION)"

  # A failed job fires only while it is enabled.
  - interval: 1m
    input_series:
      - series: 'sqlserver_agent_job_last_run_status{instance="db1:10060",sqlserver_instance="DB1",job_name="nightly"}'
        values: '0x5'
      - series: 'sqlserver_agent_job_enabled{instance="db1:10060",sqlserver_instance="DB1",job_name="nightly"}'
        values: '1x5'
      - series: 'sqlserver_agent_job_last_run_status{instance="db1:10060",sqlserver_instance="DB1",job_name="retired"}'
        values: '0x5'
      - series: 'sqlserver_agent_job_enabled{instance="db1:10060",sqlserver_instance="DB1",job_name="retired"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: SQLServerAgentJobFailed
        exp_alerts:
          - exp_labels: {severity: warning, instance: "db1:10060", sqlserver_instance: DB1, job_name: nightly}
            exp_annotations:
              summary: "SQL Agent job nightly failed on DB1"

  # A stopped distribution agent: status stays 2 (succeeded), the history
  # stops moving and the queue grows.
  - interval: 1m
    input_series:
      - series: 'sqlserver_replication_agent_run_status{distribution_db="distribution",agent_type="distribution",agent_name="pub-sub",publication="P",subscriber="SUB",subscriber_db="db"}'
        values: '2x90'
      - series: 'sqlserver_replication_agent_last_history_timestamp_seconds{distribution_db="distribution",agent_type="distribution",agent_name="pub-sub",publication="P",subscriber="SUB",subscriber_db="db"}'
        values: '0x90'
      - series: 'sqlserver_replication_pending_commands{distribution_db="distribution",agent_type="distribution",agent_name="pub-sub",publication="P",subscriber="SUB",subscriber_db="db"}'
        values: '20000+100x90'
    alert_rule_test:
      - eval_time: 90m
        alertname: SQLServerReplicationAgentFailed
        exp_alerts: []
      - eval_time: 65m
        alertname: SQLServerReplicationAgentStale
        exp_alerts: []
      - eval_time: 75m
        alertname: SQLServerReplicationAgentStale
        exp_alerts:
          - exp_labels: {severity: warning, distribution_db: distribution, agent_type: distribution, agent_name: pub-sub, publication: P, subscriber: SUB, subscriber_db: db}
            exp_annotations:
              summary: "Replication distribution agent pub-sub has no history for over an hour"
      - eval_time: 40m
        alertname: SQLServerReplicationPendingCommands
        exp_alerts:
          - exp_labels: {severity: warning, distribution_db: distribution, agent_type: distribution, agent_name: pub-sub, publication: P, subscriber: SUB, subscriber_db: db}
            exp_annotations:
              summary: "24000 commands waiting for SUB/db (P), still growing"

  # Query Store switched itself to READ_ONLY; a database where both states
  # match does not fire.
  - interval: 1m
    input_series:
      - series: 'sqlserver_query_store_desired_state{instance="db1:10060",sqlserver_instance="DB1",db_name="app",state="READ_WRITE"}'
        values: '1x20'
      - series: 'sqlserver_query_store_actual_state{instance="db1:10060",sqlserver_instance="DB1",db_name="app",state="READ_ONLY"}'
        values: '1x20'
      - series: 'sqlserver_query_store_desired_state{instance="db1:10060",sqlserver_instance="DB1",db_name="ok",state="READ_WRITE"}'
        values: '1x20'
      - series: 'sqlserver_query_store_actual_state{instance="db1:10060",sqlserver_instance="DB1",db_name="ok",state="READ_WRITE"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: SQLServerQueryStoreNotCapturing
        exp_alerts:
          - exp_labels: {severity: warning, instance: "db1:10060", sqlserver_instance: DB1, db_name: app, state: READ_WRITE}
            exp_annotations:
              summary: "Query Store of app on DB1 is not READ_WRITE"

  # Log backups stopped: the log since the last log backup only grows.
  - interval: 1m
    input_series:
      - series: 'sqlserver_database_log_since_last_log_backup_bytes{instance="db1:10060",sqlserver_instance="DB1",db_name="app"}'
        values: '11e9+1e7x180'
    alert_rule_test:
      - eval_time: 150m
        alertname: SQLServerLogBackupsStopped
        exp_alerts:
          - exp_labels: {severity: warning, instance: "db1:10060", sqlserver_instance: DB1, db_name: app}
            exp_annotations:
              summary: "app on DB1 has 10 GB+ of log since the last log backup, still growing"

  # Mirroring: 4 and 6 are both synchronized.
  - interval: 1m
    input_series:
      - series: 'sqlserver_mirroring_state{instance="db1:10060",sqlserver_instance="DB1",db_name="sync"}'
        values: '4x10'
      - series: 'sqlserver_mirroring_state{instance="db1:10060",sqlserver_instance="DB1",db_name="witness"}'
        values: '6x10'
      - series: 'sqlserver_mirroring_state{instance="db1:10060",sqlserver_instance="DB1",db_name="lost"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: SQLServerMirroringNotSynchronized
        exp_alerts:
          - exp_labels: {severity: critical, instance: "db1:10060", sqlserver_instance: DB1, db_name: lost}
            exp_annotations:
              summary: "Mirroring of lost on DB1 is not synchronized"

  # Old log backup: only databases still in FULL or BULK_LOGGED recovery
  # (msdb keeps the history after a switch to SIMPLE).
  - interval: 1m
    input_series:
      - series: 'sqlserver_backup_last_completed_timestamp_seconds{instance="db1:10060",sqlserver_instance="DB1",database_name="app",backup_type="log"}'
        values: '0x300'
      - series: 'sqlserver_database_recovery_model{instance="db1:10060",sqlserver_instance="DB1",db_name="app",recovery_model="FULL"}'
        values: '1x300'
      - series: 'sqlserver_backup_last_completed_timestamp_seconds{instance="db1:10060",sqlserver_instance="DB1",database_name="was_full",backup_type="log"}'
        values: '0x300'
      - series: 'sqlserver_database_recovery_model{instance="db1:10060",sqlserver_instance="DB1",db_name="was_full",recovery_model="SIMPLE"}'
        values: '1x300'
    alert_rule_test:
      - eval_time: 5h
        alertname: SQLServerLogBackupTooOld
        exp_alerts:
          - exp_labels: {severity: warning, instance: "db1:10060", sqlserver_instance: DB1, database_name: app, backup_type: log}
            exp_annotations:
              summary: "Last log backup of app on DB1 is older than 4 hours"

  # Background collections: one alert per collector, and a failed run alerts
  # even when it ran on time.
  - interval: 1m
    input_series:
      - series: 'sqlserver_index_fragmentation_last_collection_timestamp_seconds{instance="db1:10060",sqlserver_instance="DB1"}'
        values: '0x30'
      - series: 'sqlserver_query_store_last_collection_timestamp_seconds{instance="db1:10060",sqlserver_instance="DB1"}'
        values: '0x30'
      - series: 'sqlserver_index_fragmentation_last_collection_success{instance="db1:10060",sqlserver_instance="DB1"}'
        values: '1x30'
      - series: 'sqlserver_query_store_last_collection_success{instance="db1:10060",sqlserver_instance="DB1"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: SQLServerBackgroundCollectionStale
        exp_alerts:
          - exp_labels: {severity: warning, instance: "db1:10060", sqlserver_instance: DB1, collector: query_store}
            exp_annotations:
              summary: "The query_store background collection on DB1 has not run on time"
      - eval_time: 30m
        alertname: SQLServerBackgroundCollectionFailing
        exp_alerts:
          - exp_labels: {severity: warning, instance: "db1:10060", sqlserver_instance: DB1, collector: query_store}
            exp_annotations:
              summary: "The last query_store background collection on DB1 failed"
