# Example config file for mssql-exporter. Pass it with --config.file config.yml
#
# Precedence (highest first) for every field below: CLI flag > environment
# variable > this config file > default. DSN has no CLI flag on purpose,
# since process arguments are visible via `ps`/task manager; use SQL_SERVER_DSN
# or this file instead.

dsn: "sqlserver://sa:MyStrongP%40ss@localhost:1433?database=master&app+name=mssql-exporter"

web:
  listen_address: ":9187"
  telemetry_path: "/metrics"
  # Optional exporter-toolkit web config file enabling TLS and/or basic auth:
  # config_file: "web-config.yml"

# Toggle individual collectors (SQL Server collectors default to enabled
# except log_shipping, which needs extra msdb grants; os_collectors defaults
# to disabled).
collectors:
  os_collectors: false
  # wait_stats: true
  # io_file_stats: true
  # sessions: true
  # server_info: true
  # memory_clerks: true
  # backups: true
  # tempdb: true
  # perf_counters: true
  # databases: true
  # blocking: true
  # active_queries: true
  # availability_groups: true
  # agent_jobs: true
  # volumes: true
  # schedulers: true
  # database_mirroring: true
  # log_shipping: false
  # top_queries: false
  # index_fragmentation: false

# Options of the top_queries collector. They do not enable it: set
# `top_queries: true` under `collectors:` above.
# top_queries:
#   limit: 50            # queries by total CPU time, 1-1000
#   include_text: false  # statement text with literals obfuscated
#   text_length: 120     # 16-4000

# Options of the index_fragmentation collector. They do not enable it: set
# `index_fragmentation: true` under `collectors:` above.
# It collects in the background on its own interval, not on every scrape.
# index_fragmentation:
#   interval: 6h          # minimum 1m
#   min_page_count: 1000  # skip smaller indexes (8 KB pages)
#   databases: []         # default: every accessible user database
