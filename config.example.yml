# Example config file for mssql-exporter. Pass it with --config.file config.yml
#
# Precedence (highest first) for every field below: CLI flag > environment
# variable > this config file > default. DSN has no CLI flag on purpose,
# since process arguments are visible via `ps`/task manager; use SQL_SERVER_DSN
# or this file instead.

dsn: "sqlserver://sa:MyStrongP%40ss@localhost:1433?database=master&app+name=mssql-exporter"

web:
  listen_address: ":9187"
  telemetry_path: "/metrics"
  # Optional exporter-toolkit web config file enabling TLS and/or basic auth:
  # config_file: "web-config.yml"

# Toggle individual collectors (SQL Server collectors default to enabled
# except log_shipping, which needs extra msdb grants; os_collectors defaults
# to disabled).
collectors:
  os_collectors: false
  # wait_stats: true
  # io_file_stats: true
  # sessions: true
  # server_info: true
  # memory_clerks: true
  # backups: true
  # tempdb: true
  # perf_counters: true
  # databases: true
  # blocking: true
  # availability_groups: true
  # agent_jobs: true
  # volumes: true
  # schedulers: true
  # database_mirroring: true
  # log_shipping: false
