name: Supabase Backup

on:
  schedule:
    - cron: '0 1 * * *' # 22:00 BRT (UTC-3) / 01:00 UTC
  workflow_dispatch:     # permite disparar manualmente pela interface do GitHub

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          repository: viniciussouzao/supabase-backup-routine

      - name: Instalar postgresql-client-17
        run: |
          sudo apt-get install -y curl gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> $GITHUB_PATH
          pg_dump --version

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -o supabase-backup .

      - name: Executar backup
        env:
          SUPABASE_PROJECT_NAME:         ${{ secrets.SUPABASE_PROJECT_NAME }}
          SUPABASE_DB_URL:               ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_S3_ENDPOINT:          ${{ secrets.SUPABASE_S3_ENDPOINT }}
          SUPABASE_S3_ACCESS_KEY_ID:     ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          SUPABASE_S3_REGION:            ${{ secrets.SUPABASE_S3_REGION }}
          AWS_ACCESS_KEY_ID:             ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY:         ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:            ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_S3_BUCKET:                 ${{ secrets.AWS_S3_BUCKET }}
          AWS_S3_FOLDER:                 ${{ secrets.AWS_S3_FOLDER }}
          TELEGRAM_BOT_TOKEN:            ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:              ${{ secrets.TELEGRAM_CHAT_ID }}
        run: ./supabase-backup
