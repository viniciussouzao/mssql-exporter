name: Release

# Triggered when a PR targeting main is merged with a release label:
#   release:major, release:minor, release:patch (or "release", an alias for
#   patch). With several labels, the largest bump wins.
# Bumps the version from the latest vX.Y.Z tag (v0.1.0 when there is none),
# pushes the new tag, and runs GoReleaser to publish a GitHub Release with
# cross-platform binaries.
#
# pull_request_target, not pull_request: for a PR from a fork, pull_request
# runs with a read-only token and the tag push fails. pull_request_target runs
# the workflow from main with this repository's token, which is safe here
# because the job only runs after the merge and checks out main (code a
# maintainer merged), never the PR head, and the PR's labels reach the shell
# through an environment variable. Do not add a checkout of the PR head or
# expand PR fields (title, body, branch name) inside run:.
on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: write

# One release at a time: two runs in parallel read the same latest tag, and
# the one that publishes last becomes "Latest" even with the lower version
# (v0.18.4 after v0.19.0). GitHub keeps one pending run per group, so a third
# merge while one runs and one waits cancels the waiting run; its changes go
# out with the next release, but its label does not count. Merge release PRs
# one at a time, or two in a row at most.
concurrency:
  group: release
  cancel-in-progress: false

# Builds use the latest Go 1.27 patch. go.mod only holds the minimum, and
# setup-go would install exactly that version (go-version-file).
env:
  GO_VERSION: "1.27.x"

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true && (
        contains(github.event.pull_request.labels.*.name, 'release') ||
        contains(github.event.pull_request.labels.*.name, 'release:patch') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:major'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Determine next version
        id: version
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          bump=patch
          case ",$LABELS," in
            *,release:major,*) bump=major ;;
            *,release:minor,*) bump=minor ;;
          esac

          latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$latest_tag" ]; then
            next_tag="v0.1.0"
          else
            IFS='.' read -r major minor patch <<< "${latest_tag#v}"
            case "$bump" in
              major) next_tag="v$((major + 1)).0.0" ;;
              minor) next_tag="v${major}.$((minor + 1)).0" ;;
              patch) next_tag="v${major}.${minor}.$((patch + 1))" ;;
            esac
          fi
          echo "Bump: $bump (latest: ${latest_tag:-none}) -> $next_tag"
          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> 2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
