name: Release

# Triggered when a PR targeting main is merged with a release label:
#   release:major, release:minor, release:patch (or "release", an alias for
#   patch). With several labels, the largest bump wins.
# Bumps the version from the latest vX.Y.Z tag (v0.1.0 when there is none),
# pushes the new tag, and runs GoReleaser to publish a GitHub Release with
# cross-platform binaries.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

# Builds use the latest Go 1.27 patch. go.mod only holds the minimum, and
# setup-go would install exactly that version (go-version-file).
env:
  GO_VERSION: "1.27.x"

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true && (
        contains(github.event.pull_request.labels.*.name, 'release') ||
        contains(github.event.pull_request.labels.*.name, 'release:patch') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:major'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Determine next version
        id: version
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          bump=patch
          case ",$LABELS," in
            *,release:major,*) bump=major ;;
            *,release:minor,*) bump=minor ;;
          esac

          latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$latest_tag" ]; then
            next_tag="v0.1.0"
          else
            IFS='.' read -r major minor patch <<< "${latest_tag#v}"
            case "$bump" in
              major) next_tag="v$((major + 1)).0.0" ;;
              minor) next_tag="v${major}.$((minor + 1)).0" ;;
              patch) next_tag="v${major}.${minor}.$((patch + 1))" ;;
            esac
          fi
          echo "Bump: $bump (latest: ${latest_tag:-none}) -> $next_tag"
          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> 2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
