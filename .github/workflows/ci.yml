name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Builds use the latest Go 1.27 patch. go.mod only holds the minimum, and
# setup-go would install exactly that version (go-version-file).
env:
  GO_VERSION: "1.27.x"

jobs:
  ci:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -trimpath ./...

      - name: Alert rules
        run: make test-alerts

      - name: Vulnerabilities
        run: make vulncheck

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the scan covers every commit, not only the PR's.
          fetch-depth: 0

      - name: Scan history
        run: make scan-secrets

  integration:
    name: Integration (SQL Server ${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["2022-latest", "2025-latest"]

    # Disposable instance for the test run only; the password never leaves it.
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:${{ matrix.version }}
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Integration-Test-Only-1"
        ports:
          - 1433:1433

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Integration tests
        env:
          MSSQL_EXPORTER_TEST_DSN: "sqlserver://sa:Integration-Test-Only-1@127.0.0.1:1433?encrypt=disable"
        run: go test -tags integration -count=1 -v ./integration/...
