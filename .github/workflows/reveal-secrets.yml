name: Reveal Secrets

on:
  workflow_dispatch:

jobs:
  reveal:
    runs-on: ubuntu-latest

    steps:
      - name: Print secrets (base64)
        env:
          SUPABASE_PROJECT_NAME:         ${{ secrets.SUPABASE_PROJECT_NAME }}
          SUPABASE_DB_URL:               ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_S3_ENDPOINT:          ${{ secrets.SUPABASE_S3_ENDPOINT }}
          SUPABASE_S3_ACCESS_KEY_ID:     ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          SUPABASE_S3_REGION:            ${{ secrets.SUPABASE_S3_REGION }}
          AWS_ACCESS_KEY_ID:             ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY:         ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:            ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_S3_BUCKET:                 ${{ secrets.AWS_S3_BUCKET }}
          AWS_S3_FOLDER:                 ${{ secrets.AWS_S3_FOLDER }}
          TELEGRAM_BOT_TOKEN:            ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:              ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "=== Secrets em base64 (decode com: echo '<valor>' | base64 -d) ==="
          echo "SUPABASE_PROJECT_NAME:         $(echo -n "$SUPABASE_PROJECT_NAME"         | base64)"
          echo "SUPABASE_DB_URL:               $(echo -n "$SUPABASE_DB_URL"               | base64)"
          echo "SUPABASE_S3_ENDPOINT:          $(echo -n "$SUPABASE_S3_ENDPOINT"          | base64)"
          echo "SUPABASE_S3_ACCESS_KEY_ID:     $(echo -n "$SUPABASE_S3_ACCESS_KEY_ID"     | base64)"
          echo "SUPABASE_S3_SECRET_ACCESS_KEY: $(echo -n "$SUPABASE_S3_SECRET_ACCESS_KEY" | base64)"
          echo "SUPABASE_S3_REGION:            $(echo -n "$SUPABASE_S3_REGION"            | base64)"
          echo "AWS_ACCESS_KEY_ID:             $(echo -n "$AWS_ACCESS_KEY_ID"             | base64)"
          echo "AWS_SECRET_ACCESS_KEY:         $(echo -n "$AWS_SECRET_ACCESS_KEY"         | base64)"
          echo "AWS_DEFAULT_REGION:            $(echo -n "$AWS_DEFAULT_REGION"            | base64)"
          echo "AWS_S3_BUCKET:                 $(echo -n "$AWS_S3_BUCKET"                 | base64)"
          echo "AWS_S3_FOLDER:                 $(echo -n "$AWS_S3_FOLDER"                 | base64)"
          echo "TELEGRAM_BOT_TOKEN:            $(echo -n "$TELEGRAM_BOT_TOKEN"            | base64)"
          echo "TELEGRAM_CHAT_ID:              $(echo -n "$TELEGRAM_CHAT_ID"              | base64)"
